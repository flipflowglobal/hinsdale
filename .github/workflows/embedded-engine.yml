name: Embedded Engine Packaging

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - "modules/hinsdale-engine/**"
      - "scripts/verify-embedded-engine.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/embedded-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "modules/hinsdale-engine/**"
      - "scripts/verify-embedded-engine.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/embedded-engine.yml"

permissions:
  contents: read

concurrency:
  group: embedded-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.0"
  RUSTFLAGS: "-D warnings"

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm lint && pnpm test
      - working-directory: engine
        run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check

  android-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006"
      - name: Build Rust Android libraries
        env:
          ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/27.1.12297006"
          ANDROID_API_LEVEL: "24"
        run: bash modules/hinsdale-engine/scripts/build-android.sh
      - name: Verify Android outputs
        run: |
          test -s modules/hinsdale-engine/android/src/main/jniLibs/arm64-v8a/libhinsdale_engine.so
          test -s modules/hinsdale-engine/android/src/main/jniLibs/armeabi-v7a/libhinsdale_engine.so
          node scripts/verify-embedded-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hinsdale-android-libraries
          path: modules/hinsdale-engine/android/src/main/jniLibs
          retention-days: 14
          if-no-files-found: error

  ios-artifacts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN }}"
      - name: Build Rust iOS framework
        run: bash modules/hinsdale-engine/scripts/build-ios.sh
      - name: Verify iOS output
        run: |
          test -f modules/hinsdale-engine/ios/HinsdaleEngine.xcframework/Info.plist
          node scripts/verify-embedded-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hinsdale-ios-framework
          path: modules/hinsdale-engine/ios/HinsdaleEngine.xcframework
          retention-days: 14
          if-no-files-found: error

  release-readiness:
    needs: [source-contracts, android-artifacts, ios-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hinsdale-android-libraries
          path: modules/hinsdale-engine/android/src/main/jniLibs
      - uses: actions/download-artifact@v4
        with:
          name: hinsdale-ios-framework
          path: modules/hinsdale-engine/ios/HinsdaleEngine.xcframework
      - run: node scripts/verify-embedded-engine.mjs
      - run: pnpm check && pnpm test
