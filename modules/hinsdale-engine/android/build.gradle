plugins {
  id 'com.android.library'
  id 'kotlin-android'
}

group = 'expo.modules.hinsdaleengine'
version = '1.0.0'

android {
  namespace 'expo.modules.hinsdaleengine'
  compileSdkVersion 35
  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild { cmake { cppFlags '-std=c++20 -fexceptions -frtti' } }
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

dependencies { implementation project(':expo-modules-core') }
